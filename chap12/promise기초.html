<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //1. Promise 객체만 생성 (아직 실행 아니다): 2초 뒤 성공 또는 실패
        // Promise object 만들기
        //promise 방식은 then 으로 method chaining 방식임 -> 이것도 callback 비슷하게 불편함 (콜백지옥보단 살짝 나을수도)

        const fetchData = new Promise((resolve, reject) => {
            setTimeout(() => {

                //const success 로 데이터 성공적으로 받았는지 안받았는지 확인하고  
                const success = true; //기본으로 true를 주고 실패시 false로 변경
                if(success){ //회원정보 추출 성공했을때
                    resolve({id:1, name: "홍길동"});  //성공시 호출 될 함수 
                }else{
                    reject(new Error('회원 데이터 로드 실패'));
                }

            }, 2000);
        });

        //진짜 실행 fetchData object안에 있는 .then이라는 method
        //then method가 Promise object를 또 return  -> 성공시 id -> 저 id를 꺼낼 수 있음
        fetchData 
            .then((data) => { //성공시 (resolve부분 - {id:1, name: "홍길동"}이 (data)로 들어감 )
                console.log('성공 : ', data.name);
                return data.id;   //return을 하면 Promise 오브젝트가 또 생김   -> 성공시 promise object 가 나옴 -> . 을 또 사용가능 (chaining 가능)
            })
            .then((id) => {
                console.log('ID 확인 : ', id);
            })
            .catch((error) => { //reject(new Error('회원 데이터 로드 실패') 와 그전 두개의 then문에서 에러날때도
                console.log('에러 : ', error.message);
            })
            .finally(() => {
                //항상 실행될 것을 기재
                console.log("항상 실행")
            });
        console.log('Promise 상태 확인 (pending) : ',fetchData)
    </script>
</body>
</html>
