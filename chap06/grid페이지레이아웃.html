<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 페이지 레이아웃</title>
    <style>
        .page-layout {
            display : grid;
            grid-template-columns: 200px 1fr; /*2칸짜리 column*/ 
            grid-template-rows: 60px 1fr 50px; /*3 rows (헤더, 본문, 푸터)*/

            grid-template-areas:   /*영역을 잡아주는것*/
            "header header"  /*헤더는 2열 모두 차지*/
            "sidebar main"  /*사이드바와 본문 나란히*/
            "footer footer" ;/*푸터는 2열 모두 차지*/
            gap: 8px;
            min-height: 300px;
        }

        /* grid-area로 각 요소에 이름 지정 */
        /* 영역 선택 */
        .site-header {grid-area: header;}
        .site-sidebar {grid-area: sidebar;}
        .site-main {grid-area: main;}
        .site-footer {grid-area: footer;}

        /* 공통 디자인 */
        /*            부모의 자식 모두 라는 뜻임   > *    */
        .page-layout > * {
            border-radius: 6px;
            display: flex;
            background-color: aliceblue;
            align-items: center;
            justify-content: center;
            color: #f06dcf;
        }
        .site-header {background-color: rgb(137, 238, 238);}
        .site-sidebar {background-color: #b9b9b9;} 
        .site-main {background-color: #f06dcf; color: black}

    </style>
</head>
<body>
    <div class = "page-layout">
        <header class= "site-header">헤더 (header)</header>
        <aside class = "site-sidebar">사이드바 (sidebar)</aside>
        <main class = "site-main">본문 (main)</main>
        <footer class = "site-footer">푸터 (footer)</footer>
    </div>
</body>
</html>
