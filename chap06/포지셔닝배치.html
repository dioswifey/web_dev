<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>포지셔닝배치</title>
    <style>
      .card-container {
        display: flex;
        gap: 20px;
        padding: 20px;
      }
      /* 카드 : relative로 자식의 absolute 기준  */
      .card {
        position: relative; /*자식들이 absolute 기준점*/
        width: 180px;
        padding: 20px 16px;
        background-color: rgb(189, 255, 233);
        border: 1px solid #f9defa;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(230, 156, 156, 0.8);
      }
      .card-title {
        font-weight: bold;
        margin-bottom: 8px;
        color: #160000;
      }

      .card-desc {
        font-size: 13px;
        color: #666
      }

      .badge {
        position: absolute;   /*부모는 현재 .card 를 기준으로*/
        top: -10px; /*카드 상단에서 위로 10px*/
        right: -10px; /*카드 우측에서 바깥으로 -10만큼 이동*/
        background-color: #f7d9f4;
        color: rgb(85, 11, 77);
        font-size: 11px;
        font-weight: bold;
        padding: 4px 8px;
        border-radius: 20px;
      }

      /*fixed 버튼*/
      .floating-btn {
        position: fixed; 
        right: 20px;
        bottom: 20px;
        background-color: #2c7be5;
        color: white;
        border: none;
        border-radius: 50px;
        padding:  6px 20px;

        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 4px 12px blue;
      }

    </style>
  </head>
  <body>
    <div class="card-container">
      <div class="card">
        <span class="badge">NEW</span> 
        <p class="card-title">상품이름</p>
        <p class="card-desc">설명 텍스트가 들어갑니다</p>
      </div>
      <div class="card">
        <span class="badge">SALE</span>
        <p class="card-title">상품이름</p>
        <p class="card-desc">설명 텍스트가 들어갑니다</p>
      </div>
      <div class="card">
        <p class="card-title">상품 이름</p>
        <p class="card-desc">설명 텍스트가 들어갑니다</p>
      </div>
    </div>
    <button class="floating-btn">+ 새로 추가</button>
  </body>
</html>
