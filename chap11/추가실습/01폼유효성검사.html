<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>폼 유효성 검사</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; }
    .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
    input { padding: 9px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    input.invalid { border-color: #e74c3c; background: #fff5f5; }  /* 에러 시 빨간 테두리 */
    .error { color: #e74c3c; font-size: 0.82rem; min-height: 1em; }
    button { padding: 10px; width: 100%; background: #3498db; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    #form-status { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>회원가입</h2>
  <form id="signup-form" novalidate>
    <div class="field">
      <input name="email" placeholder="이메일" />
      <span class="error" data-for="email"></span>
    </div>
    <div class="field">
      <input name="password" type="password" placeholder="비밀번호 (8자 이상)" />
      <span class="error" data-for="password"></span>
    </div>
    <button type="submit">가입하기</button>
  </form>
  <p id="form-status"></p>
  <script>
    //폼(form), 제출 결과(p) 변수 선언   접근해서 처리 가능함
    const form = document.querySelector('#signup-form');
    const statusEl = document.querySelector('#form-status')

    //Javascript을 사용해서 만든 validation 기본 틍
    //github 에다가 정리하기 

    //검증 규칙을 별도 관리
    //[검증규칙] 필드명 -> {검사함수, 에러메시지(에러메시지 2개 - 이메일, 패스워드) }'
    //rules 가 key {email, password} 는 value들
    const rules = {
        email: {
            //정규식 : @와 .이있고 공백이 없으면 통과
            
            test:(value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value),    //정규식 오브젝트가 생성됨
            message: "올바른 이메일 형식이 아닙니다.",
        },
        password: { //8자 이상 이면 통과
            test: (value) => value.length >= 8, // 8자 이상이면 true, 아니면 false
            message: "비밀번호는 8자 이상", 
        }
    }   

    //사용자가 입력한 값을 검증, 통과하면 true
    //여기서 field 는 이메일 패스워드 input
    function validateField(field) {
        const rule = rules[field.name]; //field.name이 email이거나 password
        if(!rule) return true; //rules안에 없으면 그냥 통과시켜야되니까 true줘야함
        const valid = rule.test(field.value); //valid에는 true 아니면 false가 저장됨
        // 이 필드에 대응하는 에러 표시 칸을 data-for 속성으로 찾는다 
        const errorEl = form.querySelector(`.error[data-for="${field.name}"]`); //클래스가 error인 값

        if(valid){//true : 정상 입력, 빨강 X, 에러메시지 X
            field.classList.remove("invalid");   //빨간 테두리 제거
            errorEl.textContent = ""; //에러 메시지를 제거 
        } else{
            field.classList.add("invalid"); //빨간 테두리 지정
            errorEl.textContent = rule.message;
        }
        return valid;
    }

    //사용자가 입력할때 발생하는 이벤트: 대표적인건 input
    //이벤트를 부모에 걸어 위임 -> input의 공통부모인 <form> 에 걸어야함
    //위임을 할때는 (event) 식으로 매게변수를 줘야함 event이든 e 이든 아무거나 받는 변수가 있어야함
    //form안에서 input이벤트가 발생하면  그 이벤트 정보를 event라는 변수로 받아서 실행함

    //<input> 일때만 되는지 보기
    //이벤트 위임을 위함 
    form.addEventListener("input", (event) => {
        //입력 요소에서 input 이벤트만 검증 : (event.target.matches("input"))
        //true 나 false 로 나옴
        if (event.target.matches("input")) validateField(event.target);
    })

    // [제출] submit의 기본 동작 2가지 - 새로고침했을때 재결제(submit)를 막음, 
    // 검증안되면 제출 동작을 막음
    form.addEventListener("submit", (event) =>  {
        event.preventDefault(); //이게 없으면 제출 즉시 새로 고침이 바로 일어난다
        const fields = form.querySelectorAll("input");  //2개 들어있는 배열
        let allValid = true; 
        fields.forEach((field) => {
            if (!validateField(field)) allValid = false; //하나라도 실패하면 false다. 
        });

        if(allValid){
            statusEl.textContent = "가입 요청 전송 완료";
            //실무: 이자리에서 fetch() 로 서버에 전송한다
        } else {
            statusEl.textContent = "입력값을 확인해주세요."
        }

    });

  </script>
</body>
</html>
