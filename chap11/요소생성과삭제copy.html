<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요소 생성과 삭제</title>
    <style>
        #contact-list {
            list-style: none; padding: 0;
        }

        .contact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Contact Book</h2>
    <ul id = "contact-list"></ul>
    <script>
        //서버에서 넘어온 데이터라고 가정
        const contacts = ['Jennie', 'Lisa', 'Jisoo', 'Rosie']
        const contactList = document.querySelector("#contact-list")
        
        //최적화 using .createDocumentFrangment()
        const fragment = document.createDocumentFragment();

        //forEach 문을 사용해서
        contacts.forEach((title) => {
            //1) 새 li를 생성
            const li = document.createElement('li');
            li.classList.add('contact-item')  //style .contact-item을 적용하기

            //2) span 생성해서 title을 넣어준다
            const titleSpan = document.createElement('span');
            //span에 title을 넣어준다
            titleSpan.textContent = title;

            //3) 삭제 버튼을 생성
            const  deleteBtn = document.createElement('button');
            deleteBtn.classList.add('delete-btn');  //style의 .delete.btn css추가
            deleteBtn.textContent = 'DELETE';
            //DELETE 버튼 클릭시 해당 li (li 전체)를 제거
            deleteBtn.addEventListener('click', ()  => {
                li.remove();
            });

            //4) li에다가 자식 요소를 추가해서 li remove할때 전체 다 지워지게
            li.append(titleSpan, deleteBtn);

            //5) fragment 를 사용해서 화면이 아닌 메모리에 추가 
            //fragment 에다가 li 3개를 쌓기 
            fragment.append(li);
        });
         
        //한번에 3개의 리스트를 append
        contactList.append(fragment);

    
    </script>
</body>
</html>
