<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요소 생성과 삭제</title>
    <style>
        #book-list {
            list-style: none; padding: 0;
        }

        .book-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>내 독서 목록</h2>
    <ul id = "book-list"></ul>
    <script>
        //데이터 : 서버에서 넘어온 데이터라고 "가정"
        const books = ['Python', 'Claude code', 'Agentic AI']
        const booklist = document.querySelector('#book-list')

        //최적화
        const fragment = document.createDocumentFragment();

        books.forEach((title) => {
            // 새 li를 생성한다
            const li = document.createElement('li');
            li.classList.add('book-item');  // style  .book-item{}  적용   (li에 클래스 적용)
            //span 생성
            const titleSpan = document.createElement('span');
            //span에 title을 넣어준다
            titleSpan.textContent = title;
            //삭제 버튼을 생성
            const deleteBtn = document.createElement('button');
            deleteBtn.classList.add('delete-btn');  //'delete-btn' 라는 class 추가
            deleteBtn.textContent='삭제'

            //삭제 버튼 클릭시 해당 li를 제거
            deleteBtn.addEventListener('click', ()  => {
                li.remove();
            });

            //li에다가 자식요소들을 추가 ( titleSpan과 deleteBtn )
            li.append(titleSpan, deleteBtn);

            // 화면이 아닌 메모리에 추가
            //fragment에다가 li 3개를 쌓기

            fragment.append(li);
        });
        
        booklist.append(fragment);   //한번에 3개의 리스트를 append. 
    </script>
</body>
</html>
