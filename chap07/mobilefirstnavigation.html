<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mobile first navigation</title>
    <style>
        /* 모바일 기본 사이즈 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: sans-serif;
        }
        .site-header {
            background-color: rgb(78, 93, 88);
            padding: 0 16px;
        }
        .site-header__inner {
            display: flex;
            flex-direction: column;  /*세로 배치*/
            align-items: flex-start;
        }
        .site-logo{
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
            padding: 16px 0;
            text-decoration: none;
        }
        .site-nav{
            width: 100%;
            border-top: 3.5px solid #fff;
            
        }

        .site-nav__list {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .site_nav__link {
            display: block;
            color:rgb(1, 23, 16);
            text-decoration: none;
            padding: 12px 0;
            border-bottom: 1.8px solid white;
        }
         .site_nav__link:hover {
            color: white;
         }

         /* 태블릿 스타일 */
         @media(min-width: 768px) {
            .site-header__inner {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
            .site-nav{
                width: auto; /*박스의 가운데 정렬*/
                border-top: none;
            }
            .site-nav__list{
                flex-direction: row;
                gap: 8px;
            }
            .site_nav__link {
                padding: 20px 12px;
                border-bottom: none;
            }
         }
    </style>
</head>
<body>
    <header class = "site-header">
        <div class = "site-header__inner">
            <a href = "#" class="site-logo">My Brand</a>
            <nav class = "site-nav">
                <ul class= "site-nav__list">
                    <li><a href="#" class= "site_nav__link">HOME</a></li>
                    <li><a href="#" class= "site_nav__link">INTRODUCTION</a></li>
                    <li><a href="#" class= "site_nav__link">PORTFOLIO</a></li>
                    <li><a href="#" class= "site_nav__link">CONTACT LIST</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main style = "padding: 24px 16px;" >
        <p >
            화면 너비를 줄이고 늘려보면서 navigation의 변화를 확인하세요
        </p>
    </main>
</body>
</html>
