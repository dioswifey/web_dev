<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유연한 단위 예제</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            font-family: sans-serif;
            padding: 0 clamp(16px, 4vw, 64px);
        }

        /* 히어로 섹션 : 화면 전체 높이를 차지합니다. */
        /* 최소 min을 vh */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content:center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .hero__title {
            font-size: clamp(1rem, 2.5vh, 3.5rem);
            opacity: 0.85;
        }

        .hero__subtitle {
            font-size: clamp(1rem, 2.5vh, 1.5rem);
            opacity:0.85;
        }

        .content {
            max-width: 800px;
            margin: 48px auto;
            display: grid;
            gap: 24px;
        }

        .feature {
            background-color: rgb(236, 228, 228);
            border-radius: 8px;
            padding: clamp(16px, 3vw, 32px);
        }

        .feature h3 {
            font-size: clamp(1rem, 2vw, 1.25rem);
            margin-bottom: 8px;
            color: rgb(62, 26, 26)
        }

        .feature p {
            font-size: 0.95rem;
            color: #6c6c6c;
            line-height: 1.6;
        }

        @media (min-width: 600px){
            .content {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1 class = "hero__title">유연한 레이아웃</h1>
        <p class="hero__subtitle">화면크기를 바꾸면서 글자 크기 변화를 확인해요</p>
    </section>
    <div class="content">
        <div class="feature">
            <h3>clamp() 라는 함수</h3>
            <p>최솟값과 최댁값 사이에서 유연하게 크기를 조정합니다.</p>
        </div>
        <div class="feature">
            <h3>vw/vh 단위를 이용</h3>
            <p>viewport 크기를 기준으로 요소 크기를 지정합니다.</p>
        </div>
        <div class="feature">
            <h3>max-width</h3>
            <p>넓은 화면에서 과도하게 늘어나지 않도록 최대 너비를 제한함</p>
        </div>
        <div class="feature">
            <h3>% 사용</h3>
            <p>부모요소를 기준으로 비율로 크기를 지정합니다.</p>
        </div>
    </div>
</body>
</html>
